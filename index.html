<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ゲーム選択</title>
  <style>
    :root {
      --bg1: #10182a;
      --bg2: #1d2d4a;
      --card: rgba(19, 31, 52, 0.9);
      --line: rgba(255,255,255,0.14);
      --text: #edf6ff;
      --muted: #a9bfd9;
      --accent: #4fd1ff;
      --accent2: #ffc857;
      --shadow: rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
      color: var(--text);
      -webkit-tap-highlight-color: transparent;
      overscroll-behavior: none;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .wrap {
      width: min(1100px, 100%);
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: rgba(8, 15, 28, 0.6);
      box-shadow: 0 20px 60px var(--shadow);
      backdrop-filter: blur(8px);
    }

    .title {
      text-align: center;
      margin-bottom: 24px;
    }

    .title h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3rem);
      letter-spacing: 0.08em;
    }

    .title p {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: clamp(0.95rem, 2vw, 1.1rem);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(260px, 1fr));
      gap: 22px;
    }

    .game-card {
      display: block;
      text-decoration: none;
      color: inherit;
      background: linear-gradient(180deg, rgba(20,35,60,0.95), rgba(11,20,35,0.9));
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 18px;
      min-height: 260px;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 12px 30px rgba(0,0,0,0.22);
    }

    .game-card:hover {
      transform: translateY(-4px);
      border-color: rgba(79, 209, 255, 0.5);
      box-shadow: 0 18px 36px rgba(79, 209, 255, 0.12);
    }

    .game-card::before {
      content: "";
      position: absolute;
      inset: 0 auto auto 0;
      width: 100%;
      height: 110px;
      background: linear-gradient(135deg, rgba(79,209,255,0.16), rgba(255,200,87,0.09));
      pointer-events: none;
    }

    .badge {
      position: relative;
      display: inline-block;
      background: rgba(79, 209, 255, 0.16);
      color: var(--accent);
      border: 1px solid rgba(79, 209, 255, 0.35);
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.04em;
    }

    .game-card h2 {
      position: relative;
      margin: 18px 0 10px;
      font-size: clamp(1.5rem, 3vw, 2.1rem);
    }

    .game-card p {
      position: relative;
      margin: 0;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.6;
    }

    .meta {
      position: relative;
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.08);
      font-size: 0.8rem;
      color: #dfeaff;
    }

    .start {
      position: relative;
      margin-top: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent), #67e8c3);
      color: #071422;
      font-weight: 800;
      letter-spacing: 0.04em;
    }

    @media (max-width: 720px) {
      body {
        padding: 14px;
      }

      .wrap {
        padding: 16px;
        border-radius: 18px;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .game-card {
        min-height: 220px;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="title">
      <h1>ゲーム選択</h1>
      <p>好きなゲームを選んで遊んでください</p>
    </div>

    <div class="grid">
      <a class="game-card" href="./sand-battle/index.html">
        <span class="badge">戦略ゲーム</span>
        <h2>砂場大戦争</h2>
        <p>砂を集めてユニットを出し、敵の城を破壊するシンプルな対戦ゲームです。スマホでも操作しやすいように整えています。</p>
        <div class="meta">
          <span class="tag">CPU戦</span>
          <span class="tag">対戦</span>
          <span class="tag">スマホ対応</span>
        </div>
        <div class="start">ゲーム開始</div>
      </a>

      <a class="game-card" href="./dolphin/index.html">
        <span class="badge">3Dゲーム</span>
        <h2>ドルフィン スコアアタック</h2>
        <p>3Dの海中コースを駆け抜け、リングやアイテムを獲得してスコアを競う爽快アクションゲームです。</p>
        <div class="meta">
          <span class="tag">3D</span>
          <span class="tag">スコア</span>
          <span class="tag">アクション</span>
        </div>
        <div class="start">ゲーム開始</div>
      </a>
    </div>
  </div>
</body>
</html>
